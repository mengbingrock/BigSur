name: Release desktop

# Builds the Labee desktop app on native runners — macOS (Apple Silicon / arm64)
# and Windows (x64) — and publishes both installers to a GitHub Release. NSIS
# needs Windows/Wine and the mac .dmg needs macOS, so neither can be produced on
# the other platform; each job builds its own.
#
# Trigger by pushing a v* tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`),
# or manually via workflow_dispatch with a tag input.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build & publish (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-14 # Apple Silicon
    env:
      # Evaluated once here because a step cannot read its own env in its
      # `if`, and the secrets context is not usable at job level for `if`.
      HAS_NOTARY_KEY: ${{ secrets.ASC_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Pin bun — a newer bun/tsdown turns the server bundle's "unintended
          # bundling" advisory into a fatal error.
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build workspaces (web + server + desktop)
        run: bun run turbo run build --filter=@labee/web --filter=@labee/server --filter=@labee/desktop
      # Developer ID signing + notarization. Both are optional: without the
      # secrets, electron-builder logs "skipped" and produces an unsigned DMG
      # that Gatekeeper will refuse on other Macs — fine for a fork or a
      # smoke build, not for a release. To sign for real, set:
      #   MAC_CSC_LINK          base64 of the Developer ID Application .p12
      #   MAC_CSC_KEY_PASSWORD  its password
      #   ASC_API_KEY_P8        contents of the App Store Connect API key (.p8)
      #   ASC_API_KEY_ID        its key id       (YHLN5F2K6D — the only live team key)
      #   ASC_API_ISSUER        the issuer uuid from App Store Connect → Keys
      - name: Prepare notarization key
        if: ${{ env.HAS_NOTARY_KEY == 'true' }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          umask 077
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build macOS installer (dmg, arm64)
        run: bunx electron-builder --mac dmg --arm64 --publish never
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER }}
      - name: Verify signature and notarization
        if: ${{ env.HAS_NOTARY_KEY == 'true' }}
        run: |
          APP=$(ls -d apps/desktop/release/mac-arm64/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: labee-macos-arm64
          path: apps/desktop/release/*.dmg

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build workspaces (web + server + desktop)
        run: bun run turbo run build --filter=@labee/web --filter=@labee/server --filter=@labee/desktop
      - name: Build Windows installer (NSIS, x64)
        run: bunx electron-builder --win nsis --x64 --publish never
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: labee-windows-x64
          path: apps/desktop/release/*.exe

  release:
    name: Publish GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create or update the release with both installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FILES=$(find dist -type f \( -name '*.dmg' -o -name '*.exe' \))
          echo "Release $TAG assets:"; echo "$FILES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES \
              --repo "$GITHUB_REPOSITORY" \
              --title "Labee ${TAG#v}" \
              --generate-notes
          fi
